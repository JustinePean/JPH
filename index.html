<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justine Pean Huyo-a | Photo Retoucher</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body oncontextmenu="return false;">

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">JPH</a>
            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links">
                <a href="portfolio.html">Portfolio</a>
                <a href="mailto:justinepeandh@gmail.com">Contact</a>
            </div>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-container">
            <div class="hero-text">
                <p class="subtitle">Hello, I'm</p>
                <h1>Justine</h1>
                <p class="description">
                    Dedicated to elevating visual narratives through high-end retouching and professional color grading. I translate raw captures into refined, high-impact imagery that resonates.
                </p>
                <div class="cta-container">
                    <a href="portfolio.html" class="btn">View Portfolio</a>
                    <a href="mailto:justinepeandh@gmail.com" class="btn btn-secondary">Get In Touch</a>
                </div>
            </div>
            <div class="hero-image">
                <div class="image-wrapper">
                    <img src="images/hero-portrait.png" alt="Justine Pean Huyo-a">
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Justine Pean Huyo-a. All rights reserved.</p>
    </footer>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.querySelector('.nav-links');
        const navbar = document.querySelector('.navbar');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', () => {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', String(!isExpanded));
                navLinks.classList.toggle('is-open');

                if (navbar && navLinks.classList.contains('is-open')) {
                    navbar.classList.remove('is-hidden');
                }
            });
        }

        if (navbar) {
            let lastScrollY = window.scrollY;

            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;

                if (currentScrollY <= 0) {
                    navbar.classList.remove('is-hidden');
                    lastScrollY = currentScrollY;
                    return;
                }

                if (currentScrollY > lastScrollY && !navLinks?.classList.contains('is-open')) {
                    navbar.classList.add('is-hidden');
                } else {
                    navbar.classList.remove('is-hidden');
                }

                lastScrollY = currentScrollY;
            });
        }
    </script>

</body>
</html>
