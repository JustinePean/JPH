<!DOCTYPE html>
<html lang="en" class="contact-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Think | Contact</title>
    <meta name="description" content="Get in touch for professional real estate photo editing. Request a free sample edit or ask a question.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body oncontextmenu="return false;">

    <!-- Navbar injected by common-elements.js -->
    <div id="navbar-placeholder"></div>

    <main class="contact-main">
        <header class="contact-hero">
            <div class="contact-hero-inner reveal-on-scroll">
                <p class="contact-kicker">Get In Touch</p>
                <h1>Let's Work<br>Together</h1>
                <p class="contact-lead">Have photos ready? Send me a message and I'll get back to you within 24 hours.</p>
            </div>
        </header>

        <section class="contact-section">
            <div class="contact-section-inner">
                <div class="contact-form-wrapper reveal-on-scroll">
                    <form id="contact-form" class="contact-form" novalidate>
                        <div class="form-group">
                            <label for="full-name" class="form-label">
                                Full Name <span class="required" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="text"
                                id="full-name"
                                name="fullName"
                                class="form-input"
                                placeholder="Your full name"
                                required
                                autocomplete="name"
                                aria-required="true"
                                aria-describedby="name-error"
                            >
                            <span id="name-error" class="form-error" role="alert" aria-live="polite"></span>
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">
                                Email Address <span class="required" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-input"
                                placeholder="your@email.com"
                                required
                                autocomplete="email"
                                aria-required="true"
                                aria-describedby="email-error"
                            >
                            <span id="email-error" class="form-error" role="alert" aria-live="polite"></span>
                        </div>

                        <div class="form-group">
                            <label for="subject" class="form-label">
                                Subject <span class="required" aria-hidden="true">*</span>
                            </label>
                            <input
                                type="text"
                                id="subject"
                                name="subject"
                                class="form-input"
                                placeholder="What's this about?"
                                required
                                aria-required="true"
                                aria-describedby="subject-error"
                            >
                            <span id="subject-error" class="form-error" role="alert" aria-live="polite"></span>
                        </div>

                        <div class="form-group">
                            <label for="message" class="form-label">
                                Message <span class="required" aria-hidden="true">*</span>
                            </label>
                            <textarea
                                id="message"
                                name="message"
                                class="form-input form-textarea"
                                placeholder="Tell me about your project..."
                                rows="5"
                                required
                                aria-required="true"
                                aria-describedby="message-error"
                            ></textarea>
                            <span id="message-error" class="form-error" role="alert" aria-live="polite"></span>
                        </div>

                        <button type="submit" class="btn btn-primary form-submit" id="submit-btn">
                            <span class="btn-text">Send Message</span>
                            <span class="btn-loading" aria-hidden="true"></span>
                        </button>

                        <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
                    </form>
                </div>

                <aside class="contact-sidebar reveal-on-scroll">
                    <div class="contact-info-card">
                        <h3>Quick Contact</h3>
                        <p class="contact-info-item">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            <a href="mailto:justine@justinepeandh.com">justine@justinepeandh.com</a>
                        </p>
                        <p class="contact-info-item">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            <a href="https://wa.me/+639912238610" target="_blank" rel="noopener">+63 991 223 8610</a>
                        </p>
                    </div>

                    <div class="contact-info-card">
                        <h3>Business Hours</h3>
                        <p class="contact-info-text">Monday – Friday</p>
                        <p class="contact-info-text">9:00 AM – 6:00 PM (PHT)</p>
                        <p class="contact-info-note">Response within 24 hours</p>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <!-- Footer & Back-to-top injected by common-elements.js -->
    <div id="footer-placeholder"></div>

    <script src="js/common-elements.js?v=2"></script>
    <script src="js/contact-form.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
